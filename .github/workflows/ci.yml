name: CI

# Cross-platform compile gate for every pull request (and pushes to main).
# Runs `cargo check` on macOS, Windows, and Linux so a change that breaks any
# platform's cfg path is caught before merge — `cargo check` on one OS only
# typechecks that OS's `#[cfg(target_os = ...)]` code.
#
# This is a CHECK, not a release build: it does not link the final binary
# (so it needs no signing creds, no libobs bundle, no installer tooling) and
# uses a placeholder API gateway URL since build.rs only requires the var to
# be present, not reachable.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # build.rs panics if this is unset; a placeholder is fine for `cargo check`
  # (nothing connects to it at check time).
  CROWD_CAST_API_GATEWAY_URL: "https://example.execute-api.us-east-1.amazonaws.com/prod/presign"
  # `cargo check` does not link, so it needs no OBS binaries. Skipping the macOS
  # OBS download (only macOS build.rs reads this) avoids an unauthenticated GitHub
  # API fetch that gets rate-limited on CI runners. (No-op on Windows/Linux.)
  CROWD_CAST_SKIP_OBS_INSTALL: "1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
          - name: Linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-targets: false

      # Linux builds compile the GTK3 setup wizard (src/ui/wizard_linux.c) and
      # probe GTK via pkg-config in build.rs, so the dev headers must be present.
      # Linking against libobs is deferred to `cargo build`, so no OBS bundle is
      # needed for `cargo check`.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev
          dpkg-query -W -f='${Package}=${Version}\n' \
            build-essential pkg-config libgtk-3-dev

      # The libobs crate vendors OBS headers that #include <simde/x86/sse2.h>. On dev/release
      # machines simde is already present (pulled in with OBS); a clean macOS runner needs it
      # installed and added to bindgen's clang include path.
      - name: Install simde headers (macOS libobs bindgen)
        if: matrix.os == 'macos-15'
        run: |
          brew install simde
          brew info --json=v2 simde
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"

      - name: Record hosted runner image
        shell: bash
        run: |
          : "${ImageOS:?hosted runner did not report ImageOS}"
          : "${ImageVersion:?hosted runner did not report ImageVersion}"
          printf 'runner_image=%s/%s\n' "$ImageOS" "$ImageVersion"

      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          cargo clippy --version

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: cargo fmt
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features --locked --offline
