name: Windows Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release authority and isolated update feed
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  S3_BUCKET: crowd-cast-bucket
  AWS_REGION: us-east-1
  WINSPARKLE_URL: https://github.com/vslavik/winsparkle/releases/download/v0.9.3/WinSparkle-0.9.3.zip
  WINSPARKLE_SHA256: 745985f41d2ab26b2d5a1cf87d76e4ed851039db19038e50610eb25ea0b73772
  WINSPARKLE_SIZE: "27194631"

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    environment:
      name: crowd-cast-windows-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify dispatch, source, and release authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUNNER_IMAGE_VERSION: ${{ vars.WINDOWS_RUNNER_IMAGE_VERSION }}
          APPROVED_LIBOBS_REVISION: ${{ vars.APPROVED_LIBOBS_REVISION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.run_attempt }}' -ne '1') { throw 'Release reruns are forbidden; dispatch a new monotonic build.' }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_RUNNER_IMAGE_VERSION)) { throw 'WINDOWS_RUNNER_IMAGE_VERSION is required.' }
          if ($env:ImageVersion -cne $env:EXPECTED_RUNNER_IMAGE_VERSION) {
            throw "Hosted runner image drift: expected $env:EXPECTED_RUNNER_IMAGE_VERSION, got $env:ImageVersion."
          }
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne '${{ github.sha }}') { throw "Checkout identity mismatch: $head" }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'Release checkout is not clean.' }

          $channel = '${{ inputs.channel }}'
          if ('${{ github.ref }}' -cne 'refs/heads/main') { throw 'Release dispatch requires refs/heads/main.' }
          $remoteMain = ((git ls-remote origin refs/heads/main) -split "`t")[0]
          if ($remoteMain -cne '${{ github.sha }}') { throw "Release SHA is not current remote main: $remoteMain" }
          $environment = gh api "repos/${{ github.repository }}/environments/crowd-cast-windows-$channel" | ConvertFrom-Json
          if (@($environment.protection_rules).Count -eq 0) { throw 'Release environment has no protection rules.' }
          if (-not $environment.deployment_branch_policy.protected_branches) {
            throw 'Release environment must require protected branches.'
          }
          $immutableReleases = gh api 'repos/${{ github.repository }}/immutable-releases' | ConvertFrom-Json
          if (-not $immutableReleases.enabled) { throw 'Repository immutable releases are not enabled.' }

          if ($env:APPROVED_LIBOBS_REVISION -cnotmatch '^[0-9a-f]{40}$') {
            throw 'APPROVED_LIBOBS_REVISION must be the independently accepted 40-character commit.'
          }
          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $libobsLines = $cargo -split "`n" | Where-Object { $_ -match '^(libobs|libobs-wrapper|libobs-simple|libobs-bootstrapper|cargo-obs-build)\s*=' }
          if ($libobsLines.Count -lt 4) { throw 'Expected libobs dependencies are missing.' }
          $revisions = @()
          foreach ($line in $libobsLines) {
            if ($line -notmatch 'rev\s*=\s*"([0-9a-f]{40})"') { throw "Mutable libobs dependency: $line" }
            $revisions += $Matches[1]
          }
          $unique = @($revisions | Sort-Object -Unique)
          if ($unique.Count -ne 1 -or $unique[0] -cne $env:APPROVED_LIBOBS_REVISION) {
            throw 'Cargo libobs pins do not equal the independently approved revision.'
          }
          if (Select-String -Path build.rs -Pattern 'cargo_obs_build::install' -Quiet) {
            throw 'Mutable build-time OBS installation is still enabled.'
          }
          if (Select-String -Path src/capture/context.rs -Pattern 'ObsBootstrapperOptions::default|set_update\(' -Quiet) {
            throw 'Runtime OBS bootstrap is not bound to one application manifest.'
          }
          throw 'Windows release is blocked until the signed installer bundles the exact OBS closure under protected installation ACLs; an in-process bootstrap receipt cannot authorize statically imported obs.dll.'

      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Record exact toolchain
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version --verbose
          gh --version
          aws --version

      - name: Read back exact native bundle manifest and archive
        id: native
        shell: pwsh
        env:
          MANIFEST_URL: ${{ vars.CROWD_CAST_OBS_BUNDLE_MANIFEST_URL }}
          MANIFEST_SHA256: ${{ vars.CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256 }}
          APPROVED_LIBOBS_REVISION: ${{ vars.APPROVED_LIBOBS_REVISION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MANIFEST_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Native manifest SHA-256 is not canonical.' }
          if ($env:MANIFEST_URL -match '[^\x21-\x7e]') {
            throw 'Native manifest URL contains forbidden characters.'
          }
          $manifestUri = [uri]$env:MANIFEST_URL
          if ($manifestUri.Scheme -ne 'https' -or $manifestUri.UserInfo -or $manifestUri.Query -or $manifestUri.Fragment) {
            throw 'Native manifest URL must be exact HTTPS without credentials, query, or fragment.'
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'obs-bundle-manifest.json'
          Invoke-WebRequest -Uri $manifestUri -OutFile $manifestPath -UseBasicParsing -MaximumRedirection 0 -SslProtocol Tls12
          $summaryPath = Join-Path $env:RUNNER_TEMP 'obs-bundle-summary.json'
          python scripts/verify-obs-bundle-manifest.py `
            --manifest $manifestPath `
            --manifest-sha256 $env:MANIFEST_SHA256 `
            --platform windows `
            --arch x86_64 `
            --approved-libobs-revision $env:APPROVED_LIBOBS_REVISION `
            --summary-out $summaryPath
          if ($LASTEXITCODE -ne 0) { throw 'Native manifest validation failed.' }
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          $bundleUri = [uri]$summary.bundle_url
          $bundlePath = Join-Path $env:RUNNER_TEMP 'obs-bundle.7z'
          Invoke-WebRequest -Uri $bundleUri -OutFile $bundlePath -UseBasicParsing -MaximumRedirection 0 -SslProtocol Tls12
          python scripts/verify-obs-bundle-manifest.py `
            --manifest $manifestPath `
            --manifest-sha256 $env:MANIFEST_SHA256 `
            --platform windows `
            --arch x86_64 `
            --approved-libobs-revision $env:APPROVED_LIBOBS_REVISION `
            --bundle $bundlePath `
            --summary-out $summaryPath
          if ($LASTEXITCODE -ne 0) { throw 'Native archive validation failed.' }
          "CROWD_CAST_OBS_BUNDLE_ARCHIVE_PATH=$bundlePath" >> $env:GITHUB_ENV
          "CROWD_CAST_OBS_BUNDLE_MANIFEST_PATH=$manifestPath" >> $env:GITHUB_ENV
          "CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256=$($summary.manifest_sha256)" >> $env:GITHUB_ENV
          "manifest_sha256=$($summary.manifest_sha256)" >> $env:GITHUB_OUTPUT
          "bundle_sha256=$($summary.bundle_sha256)" >> $env:GITHUB_OUTPUT
          "bundle_size=$($summary.bundle_size)" >> $env:GITHUB_OUTPUT
          "implementation_id=$($summary.implementation_id)" >> $env:GITHUB_OUTPUT

      - name: Resolve monotonic release identity
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID_FLOOR: ${{ vars.BUILD_ID_FLOOR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Cargo version is not release SemVer: $version" }
          $build = [UInt64]'${{ github.run_number }}'
          if ($build -eq 0) { throw 'Build number must be positive.' }
          if ($env:BUILD_ID_FLOOR -cnotmatch '^(0|[1-9][0-9]*)$') { throw 'BUILD_ID_FLOOR must be a canonical non-negative integer.' }
          $floor = [UInt64]$env:BUILD_ID_FLOOR
          if ($build -le $floor) { throw 'Build identity does not exceed the protected migration floor.' }
          $channel = '${{ inputs.channel }}'
          $tag = if ($channel -eq 'prod') { "windows-v$version+$build" } else { "windows-dev-v$version+$build" }
          $feedKey = if ($channel -eq 'prod') { 'appcast-win.xml' } else { 'appcast-win-dev.xml' }
          $feedUrl = "https://$env:S3_BUCKET.s3.amazonaws.com/$feedKey"
          if (git ls-remote origin "refs/tags/$tag") { throw "Remote tag already exists: $tag" }
          $previousNativeErrorMode = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $previousNativeErrorMode
          if ($releaseExists) { throw "GitHub release already exists: $tag" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "build_version=$version.$build" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "feed_key=$feedKey" >> $env:GITHUB_OUTPUT
          "feed_url=$feedUrl" >> $env:GITHUB_OUTPUT

      - name: Fetch locked Rust dependencies
        shell: pwsh
        run: cargo fetch --locked

      - name: Build release binary and installer from exact tools
        shell: pwsh
        env:
          CROWD_CAST_API_GATEWAY_URL: ${{ secrets.CROWD_CAST_API_GATEWAY_URL }}
          CROWD_CAST_GOOGLE_CLIENT_ID: ${{ secrets.CROWD_CAST_GOOGLE_CLIENT_ID }}
          CROWD_CAST_APPCAST_URL: ${{ steps.release.outputs.feed_url }}
          CROWD_CAST_ED_PUBLIC_KEY: ${{ secrets.CROWD_CAST_ED_PUBLIC_KEY }}
          CROWD_CAST_VERSION_BASE: ${{ steps.release.outputs.version }}
          CROWD_CAST_BUILD_NUMBER: ${{ steps.release.outputs.build }}
          CROWD_CAST_UPLOAD_TEST: ${{ inputs.channel == 'dev' && '1' || '' }}
        run: |
          pwsh scripts/build-windows-installer.ps1 `
            -Version '${{ steps.release.outputs.version }}' `
            -Iscc '${{ vars.INNO_SETUP_ISCC_PATH }}' `
            -IsccSha256 '${{ vars.INNO_SETUP_ISCC_SHA256 }}' `
            -WinSparkleUrl $env:WINSPARKLE_URL `
            -WinSparkleSha256 $env:WINSPARKLE_SHA256 `
            -WinSparkleSize $env:WINSPARKLE_SIZE

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign installer with environment OIDC authority
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}/dist/crowd-cast-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Clear Azure signing session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az logout
          az account clear

      - name: Verify Authenticode and generate exact appcast
        id: artifact
        shell: pwsh
        env:
          ED_PRIVATE_KEY: ${{ secrets.CROWD_CAST_ED_PRIVATE_KEY }}
          ED_PUBLIC_KEY: ${{ secrets.CROWD_CAST_ED_PUBLIC_KEY }}
          EXPECTED_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'dist/crowd-cast-setup.exe'
          $authenticode = Get-AuthenticodeSignature -LiteralPath $installer
          if ($authenticode.Status -ne 'Valid') { throw "Invalid Authenticode status: $($authenticode.Status)" }
          if ($env:EXPECTED_CERTIFICATE_THUMBPRINT -cnotmatch '^[0-9A-Fa-f]{40,64}$') { throw 'Signing certificate thumbprint is not configured.' }
          if ($authenticode.SignerCertificate.Thumbprint -cne $env:EXPECTED_CERTIFICATE_THUMBPRINT.ToUpperInvariant()) {
            throw "Unexpected signing certificate: $($authenticode.SignerCertificate.Thumbprint)"
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'ed25519.key'
          [System.IO.File]::WriteAllText($keyFile, $env:ED_PRIVATE_KEY, (New-Object System.Text.UTF8Encoding($false)))
          try {
            pwsh scripts/generate-appcast-win.ps1 `
              -InstallerPath $installer `
              -Version '${{ steps.release.outputs.version }}' `
              -BuildVersion '${{ steps.release.outputs.build_version }}' `
              -DownloadUrl 'https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/crowd-cast-setup.exe' `
              -PrivateKeyFile $keyFile `
              -PublicKey $env:ED_PUBLIC_KEY `
              -OutFile dist/appcast-win.xml
          } finally {
            Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
          }
          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reserve exact release identity before publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reservation = Join-Path $env:RUNNER_TEMP 'release-reservation.json'
          [System.IO.File]::WriteAllText($reservation, (@{
            schema = 'crowd-cast-release-reservation-v1'
            platform = 'windows'
            channel = '${{ steps.release.outputs.channel }}'
            build = [UInt64]'${{ steps.release.outputs.build }}'
            commit = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
          } | ConvertTo-Json -Compress), (New-Object System.Text.UTF8Encoding($false)))
          $versioning = aws s3api get-bucket-versioning --bucket $env:S3_BUCKET --query Status --output text
          if ($versioning -cne 'Enabled') { throw 'S3 bucket versioning must be Enabled.' }
          aws s3api put-object --bucket $env:S3_BUCKET --key 'release-ledger/windows/${{ steps.release.outputs.channel }}/${{ steps.release.outputs.build }}/reservation.json' --body $reservation --if-none-match '*' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release identity reservation failed.' }

      - name: Publish and read back exact GitHub release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.release.outputs.tag }}'
          $title = "crowd-cast Windows ${{ steps.release.outputs.version }} build ${{ steps.release.outputs.build }} (${{ inputs.channel }})"
          $arguments = @('release', 'create', $tag, 'dist/crowd-cast-setup.exe', '--repo', '${{ github.repository }}', '--target', '${{ github.sha }}', '--title', $title, '--latest=false')
          if ('${{ inputs.channel }}' -eq 'dev') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
          $release = gh api 'repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag }}' | ConvertFrom-Json
          if ($release.target_commitish -cne '${{ github.sha }}') { throw 'GitHub release target SHA mismatch.' }
          if (-not $release.immutable) { throw 'Repository immutable releases must be enabled.' }
          if ([bool]$release.prerelease -ne ('${{ inputs.channel }}' -eq 'dev')) { throw 'GitHub prerelease state mismatch.' }
          if (@($release.assets).Count -ne 1 -or $release.assets[0].name -cne 'crowd-cast-setup.exe') { throw 'GitHub release asset set mismatch.' }
          if ([UInt64]$release.assets[0].size -ne [UInt64]'${{ steps.artifact.outputs.size }}') { throw 'GitHub asset size mismatch.' }
          $readback = Join-Path $env:RUNNER_TEMP 'crowd-cast-setup-readback.exe'
          gh release download $tag --repo '${{ github.repository }}' --pattern 'crowd-cast-setup.exe' --output $readback
          $sha = (Get-FileHash -LiteralPath $readback -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -cne '${{ steps.artifact.outputs.sha256 }}') { throw 'GitHub asset readback SHA-256 mismatch.' }

      - name: Publish immutable release receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'release-receipt.json'
          [System.IO.File]::WriteAllText($receipt, ([ordered]@{
            schema = 'crowd-cast-release-receipt-v1'
            platform = 'windows'
            channel = '${{ inputs.channel }}'
            version = '${{ steps.release.outputs.version }}'
            build = [UInt64]'${{ steps.release.outputs.build }}'
            commit = '${{ github.sha }}'
            runner_image = "$env:ImageOS/$env:ImageVersion"
            libobs_manifest_sha256 = '${{ steps.native.outputs.manifest_sha256 }}'
            libobs_implementation_id = '${{ steps.native.outputs.implementation_id }}'
            installer = [ordered]@{ name = 'crowd-cast-setup.exe'; size = [UInt64]'${{ steps.artifact.outputs.size }}'; sha256 = '${{ steps.artifact.outputs.sha256 }}' }
          } | ConvertTo-Json -Depth 4 -Compress), (New-Object System.Text.UTF8Encoding($false)))
          $key = 'release-ledger/windows/${{ inputs.channel }}/${{ steps.release.outputs.build }}/receipt.json'
          aws s3api put-object --bucket $env:S3_BUCKET --key $key --body $receipt --content-type application/json --if-none-match '*' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Immutable release receipt upload failed.' }
          $readback = Join-Path $env:RUNNER_TEMP 'release-receipt-readback.json'
          aws s3api get-object --bucket $env:S3_BUCKET --key $key $readback | Out-Null
          if ((Get-FileHash $receipt -Algorithm SHA256).Hash -cne (Get-FileHash $readback -Algorithm SHA256).Hash) {
            throw 'Immutable release receipt readback mismatch.'
          }

      - name: Publish feed pointer last with rollback
        shell: bash
        run: |
          scripts/publish-s3-pointer.sh \
            --bucket "$S3_BUCKET" \
            --pointer-key '${{ steps.release.outputs.feed_key }}' \
            --archive-key 'release-feed-archive/windows/${{ inputs.channel }}/${{ steps.release.outputs.tag }}/appcast-win.xml' \
            --file dist/appcast-win.xml \
            --content-type application/xml
