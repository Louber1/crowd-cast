name: macOS Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release authority and isolated update feed
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: write
  id-token: write

concurrency:
  group: macos-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  S3_BUCKET: crowd-cast-bucket
  AWS_REGION: us-east-1

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, "crowd-cast-signing-${{ inputs.channel }}-v1"]
    timeout-minutes: 120
    environment:
      name: crowd-cast-macos-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify dispatch, source, runner, and release authority
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_LIBOBS_REVISION: ${{ vars.APPROVED_LIBOBS_REVISION }}
          EXPECTED_RUNNER_NAME: ${{ vars.MACOS_SIGNING_RUNNER_NAME }}
          EXPECTED_MACOS_VERSION: ${{ vars.MACOS_VERSION }}
          EXPECTED_XCODE_VERSION_SHA256: ${{ vars.MACOS_XCODE_VERSION_SHA256 }}
          CREATE_DMG_PATH: ${{ vars.CREATE_DMG_PATH }}
          CREATE_DMG_SHA256: ${{ vars.CREATE_DMG_SHA256 }}
          GH_PATH: ${{ vars.GH_PATH }}
          GH_SHA256: ${{ vars.GH_SHA256 }}
          AWS_PATH: ${{ vars.AWS_PATH }}
          AWS_SHA256: ${{ vars.AWS_SHA256 }}
          CURL_PATH: ${{ vars.CURL_PATH }}
          CURL_SHA256: ${{ vars.CURL_SHA256 }}
          PYTHON3_PATH: ${{ vars.PYTHON3_PATH }}
          PYTHON3_SHA256: ${{ vars.PYTHON3_SHA256 }}
        run: |
          set -euo pipefail
          [[ '${{ github.run_attempt }}' == 1 ]] || { echo 'Release reruns are forbidden; dispatch a new monotonic build.' >&2; exit 1; }
          [[ -n "$EXPECTED_RUNNER_NAME" && '${{ runner.name }}' == "$EXPECTED_RUNNER_NAME" ]] \
            || { echo 'Release job was not assigned to the exact protected signing runner.' >&2; exit 1; }
          [[ "$(uname -m)" == arm64 ]] || { echo 'Release signing runner must be arm64.' >&2; exit 1; }
          [[ -n "$EXPECTED_MACOS_VERSION" && "$(sw_vers -productVersion)" == "$EXPECTED_MACOS_VERSION" ]] \
            || { echo 'Release signing runner macOS version drifted.' >&2; exit 1; }
          [[ "$EXPECTED_XCODE_VERSION_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo 'MACOS_XCODE_VERSION_SHA256 must be canonical.' >&2; exit 1; }
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          [[ "$(shasum -a 256 "$RUNNER_TEMP/xcode-version.txt" | awk '{print $1}')" == "$EXPECTED_XCODE_VERSION_SHA256" ]] \
            || { echo 'Release signing runner Xcode identity drifted.' >&2; exit 1; }
          [[ "$CREATE_DMG_PATH" == /* && -x "$CREATE_DMG_PATH" ]] \
            || { echo 'CREATE_DMG_PATH must name one exact executable.' >&2; exit 1; }
          [[ "$CREATE_DMG_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo 'CREATE_DMG_SHA256 must be canonical.' >&2; exit 1; }
          [[ "$(shasum -a 256 "$CREATE_DMG_PATH" | awk '{print $1}')" == "$CREATE_DMG_SHA256" ]] \
            || { echo 'create-dmg tool identity drifted.' >&2; exit 1; }
          for tool in gh aws curl python3; do
            upper="$(printf '%s' "$tool" | tr '[:lower:]' '[:upper:]')"
            path_var="${upper}_PATH"
            sha_var="${upper}_SHA256"
            expected_path="${!path_var:-}"
            expected_sha="${!sha_var:-}"
            [[ "$expected_path" == /* && -x "$expected_path" && "$(command -v "$tool")" == "$expected_path" ]] \
              || { echo "$tool does not resolve to its protected exact path." >&2; exit 1; }
            [[ "$expected_sha" =~ ^[0-9a-f]{64}$ && "$(shasum -a 256 "$expected_path" | awk '{print $1}')" == "$expected_sha" ]] \
              || { echo "$tool identity drifted." >&2; exit 1; }
          done
          [[ "$(git rev-parse HEAD)" == '${{ github.sha }}' ]] || { echo 'Checkout identity mismatch.' >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'Release checkout is not clean.' >&2; exit 1; }

          [[ '${{ github.ref }}' == refs/heads/main ]] || { echo 'Release dispatch requires refs/heads/main.' >&2; exit 1; }
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_main" == '${{ github.sha }}' ]] || { echo "Release SHA is not current remote main: $remote_main" >&2; exit 1; }
          gh api 'repos/${{ github.repository }}/environments/crowd-cast-macos-${{ inputs.channel }}' > "$RUNNER_TEMP/environment.json"
          gh api 'repos/${{ github.repository }}/immutable-releases' > "$RUNNER_TEMP/immutable-releases.json"
          python3 - "$RUNNER_TEMP/environment.json" <<'PY'
          import json
          import sys

          environment = json.load(open(sys.argv[1], encoding="utf-8"))
          if not environment.get("protection_rules"):
              raise SystemExit("release environment has no protection rules")
          policy = environment.get("deployment_branch_policy") or {}
          if not policy.get("protected_branches"):
              raise SystemExit("release environment must require protected branches")
          PY
          python3 - "$RUNNER_TEMP/immutable-releases.json" <<'PY'
          import json
          import sys

          if json.load(open(sys.argv[1], encoding="utf-8")).get("enabled") is not True:
              raise SystemExit("repository immutable releases are not enabled")
          PY

          [[ "$APPROVED_LIBOBS_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo 'APPROVED_LIBOBS_REVISION must be the independently accepted commit.' >&2; exit 1; }
          python3 - "$APPROVED_LIBOBS_REVISION" <<'PY'
          import pathlib
          import re
          import sys

          approved = sys.argv[1]
          cargo = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          lines = [line for line in cargo.splitlines() if re.match(r"^(libobs|libobs-wrapper|libobs-simple|libobs-bootstrapper|cargo-obs-build)\s*=", line)]
          if len(lines) < 4:
              raise SystemExit("expected libobs dependencies are missing")
          revisions = []
          for line in lines:
              match = re.search(r'rev\s*=\s*"([0-9a-f]{40})"', line)
              if not match:
                  raise SystemExit(f"mutable libobs dependency: {line}")
              revisions.append(match.group(1))
          if set(revisions) != {approved}:
              raise SystemExit("Cargo libobs pins do not equal the independently approved revision")
          PY
          ! rg -n 'cargo_obs_build::install|ObsBootstrapperOptions::default|set_update\(' build.rs src/capture/context.rs \
            || { echo 'OBS installation is not bound to one application manifest.' >&2; exit 1; }
          rg -q 'CROWD_CAST_OBS_BUNDLE_ARCHIVE_PATH' scripts/bundle-macos.sh \
            || { echo 'macOS bundling does not consume one exact staged native archive.' >&2; exit 1; }
          rg -q 'CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256' scripts/bundle-macos.sh \
            || { echo 'macOS bundling does not bind the exact native manifest.' >&2; exit 1; }

      - name: Reject ambient cloud publication authority
        run: |
          set -euo pipefail
          for variable in \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_SHARED_CREDENTIALS_FILE \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET \
            GH_TOKEN GITHUB_TOKEN
          do
            [[ -z "${!variable+x}" ]] || { echo "Signing runner must not expose ambient $variable." >&2; exit 1; }
          done
          [[ ! -e "$HOME/.aws" ]] || { echo 'Signing runner must not retain an AWS credential/config directory.' >&2; exit 1; }
          [[ ! -e "$HOME/.azure" ]] || { echo 'Signing runner must not retain an Azure session directory.' >&2; exit 1; }
          [[ ! -e "$HOME/.config/gh/hosts.yml" ]] || { echo 'Signing runner must not retain a GitHub CLI credential store.' >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
        with:
          targets: aarch64-apple-darwin

      - name: Verify exact toolchain
        env:
          EXPECTED_RUSTC_COMMIT: ${{ vars.RUSTC_1_91_COMMIT }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUSTC_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'RUSTC_1_91_COMMIT must be canonical.' >&2; exit 1; }
          rustc --version --verbose > "$RUNNER_TEMP/rustc-version.txt"
          [[ "$(awk '/^commit-hash:/ {print $2}' "$RUNNER_TEMP/rustc-version.txt")" == "$EXPECTED_RUSTC_COMMIT" ]] \
            || { echo 'Rust compiler identity mismatch.' >&2; exit 1; }
          cargo --version --verbose
          gh --version
          aws --version

      - name: Read back exact native bundle manifest and archive
        id: native
        env:
          MANIFEST_URL: ${{ vars.CROWD_CAST_OBS_BUNDLE_MANIFEST_URL }}
          MANIFEST_SHA256: ${{ vars.CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256 }}
          APPROVED_LIBOBS_REVISION: ${{ vars.APPROVED_LIBOBS_REVISION }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Native manifest SHA-256 is not canonical.' >&2; exit 1; }
          python3 - "$MANIFEST_URL" <<'PY'
          import sys
          import urllib.parse

          value = sys.argv[1]
          if not value.isascii() or any(ord(character) <= 32 or ord(character) == 127 for character in value):
              raise SystemExit("native manifest URL contains forbidden characters")
          url = urllib.parse.urlsplit(value)
          if url.scheme != "https" or not url.hostname or url.username or url.password or url.query or url.fragment or url.geturl() != value:
              raise SystemExit("native manifest URL must be exact HTTPS without credentials, query, or fragment")
          PY
          manifest="$RUNNER_TEMP/obs-bundle-manifest.json"
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-filesize 1048576 \
            --connect-timeout 10 --max-time 120 --output "$manifest" "$MANIFEST_URL"
          summary="$RUNNER_TEMP/obs-bundle-summary.json"
          scripts/verify-obs-bundle-manifest.py \
            --manifest "$manifest" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --platform macos \
            --arch aarch64 \
            --approved-libobs-revision "$APPROVED_LIBOBS_REVISION" \
            --summary-out "$summary"
          native_values="$RUNNER_TEMP/native-values.txt"
          python3 - "$summary" > "$native_values" <<'PY'
          import json
          import sys

          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("bundle_url", "bundle_sha256", "bundle_size", "obs_abi", "implementation_id"):
              print(summary[key])
          PY
          bundle_url="$(sed -n '1p' "$native_values")"
          bundle_sha="$(sed -n '2p' "$native_values")"
          bundle_size="$(sed -n '3p' "$native_values")"
          abi="$(sed -n '4p' "$native_values")"
          implementation_id="$(sed -n '5p' "$native_values")"
          [[ -n "$bundle_url" && -n "$implementation_id" ]] || { echo 'Native manifest extraction failed.' >&2; exit 1; }
          bundle="$RUNNER_TEMP/obs-bundle.zip"
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-filesize "$bundle_size" \
            --connect-timeout 10 --max-time 300 --output "$bundle" "$bundle_url"
          scripts/verify-obs-bundle-manifest.py \
            --manifest "$manifest" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --platform macos \
            --arch aarch64 \
            --approved-libobs-revision "$APPROVED_LIBOBS_REVISION" \
            --bundle "$bundle" \
            --summary-out "$summary"
          {
            echo "CROWD_CAST_OBS_BUNDLE_ARCHIVE_PATH=$bundle"
            echo "CROWD_CAST_OBS_BUNDLE_MANIFEST_PATH=$manifest"
            echo "CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256=$MANIFEST_SHA256"
          } >> "$GITHUB_ENV"
          {
            echo "manifest_url=$MANIFEST_URL"
            echo "manifest_sha256=$MANIFEST_SHA256"
            echo "bundle_url=$bundle_url"
            echo "bundle_sha256=$bundle_sha"
            echo "bundle_size=$bundle_size"
            echo "abi=$abi"
            echo "implementation_id=$implementation_id"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve monotonic release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID_FLOOR: ${{ vars.BUILD_ID_FLOOR }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cargo version is not release SemVer: $version" >&2; exit 1; }
          build='${{ github.run_id }}'
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || { echo 'Build number must be positive.' >&2; exit 1; }
          [[ "$BUILD_ID_FLOOR" =~ ^(0|[1-9][0-9]*)$ ]] || { echo 'BUILD_ID_FLOOR must be a canonical non-negative integer.' >&2; exit 1; }
          python3 - "$build" "$BUILD_ID_FLOOR" <<'PY'
          import sys
          if int(sys.argv[1]) <= int(sys.argv[2]):
              raise SystemExit("build identity does not exceed the protected migration floor")
          PY
          channel='${{ inputs.channel }}'
          if [[ "$channel" == prod ]]; then
            tag="macos-v$version+$build"
            feed_key=appcast.xml
            upload_test=""
          else
            tag="macos-dev-v$version+$build"
            feed_key=appcast-dev.xml
            upload_test=1
          fi
          archive_name="CrowdCast-$version+$build.zip"
          feed_url="https://$S3_BUCKET.s3.amazonaws.com/$feed_key"
          archive_base_url="https://github.com/${{ github.repository }}/releases/download/$tag"
          [[ -z "$(git ls-remote origin "refs/tags/$tag")" ]] || { echo "Remote tag already exists: $tag" >&2; exit 1; }
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "GitHub release already exists: $tag" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "feed_key=$feed_key"
            echo "feed_url=$feed_url"
            echo "archive_name=$archive_name"
            echo "archive_base_url=$archive_base_url"
            echo "upload_test=$upload_test"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Verify pre-provisioned signing authority, build, sign, and notarize
        env:
          CROWD_CAST_MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          CROWD_CAST_KEYCHAIN_PATH: ${{ vars.MACOS_KEYCHAIN_PATH }}
          CROWD_CAST_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
          CROWD_CAST_CREATE_DMG_PATH: ${{ vars.CREATE_DMG_PATH }}
          CROWD_CAST_API_GATEWAY_URL: ${{ vars.CROWD_CAST_API_GATEWAY_URL }}
          CROWD_CAST_GOOGLE_CLIENT_ID: ${{ vars.CROWD_CAST_GOOGLE_CLIENT_ID }}
          CROWD_CAST_APP_VERSION: ${{ steps.release.outputs.version }}
          CROWD_CAST_BUILD_NUMBER: ${{ steps.release.outputs.build }}
          CROWD_CAST_SPARKLE_FEED_URL: ${{ steps.release.outputs.feed_url }}
          CROWD_CAST_SPARKLE_PUBLIC_ED_KEY: ${{ vars.CROWD_CAST_ED_PUBLIC_KEY }}
          CROWD_CAST_SPARKLE_ARCHIVE_BASE_URL: ${{ steps.release.outputs.archive_base_url }}
          CROWD_CAST_UPLOAD_TEST: ${{ steps.release.outputs.upload_test }}
        run: |
          set -euo pipefail
          scripts/release-macos.sh

      - name: Verify exact signed artifacts and appcast
        id: artifact
        env:
          EXPECTED_PUBLIC_KEY: ${{ vars.CROWD_CAST_ED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg=target/release/CrowdCast.dmg
          archive="target/release/sparkle/${{ steps.release.outputs.archive_name }}"
          appcast=target/release/sparkle/appcast.xml
          [[ -f "$dmg" && -f "$archive" && -f "$appcast" ]] || { echo 'Expected macOS release artifacts are missing.' >&2; exit 1; }
          cp "$dmg" dist/CrowdCast.dmg
          cp "$archive" "dist/${{ steps.release.outputs.archive_name }}"
          cp "$appcast" dist/appcast.xml
          codesign --verify --strict --deep --verbose=2 target/release/CrowdCast.app
          spctl --assess --type execute --verbose target/release/CrowdCast.app
          spctl -a -t open --context context:primary-signature -vvv dist/CrowdCast.dmg
          xcrun stapler validate target/release/CrowdCast.app
          xcrun stapler validate dist/CrowdCast.dmg
          observed_public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' target/release/CrowdCast.app/Contents/Info.plist)"
          [[ "$observed_public_key" == "$EXPECTED_PUBLIC_KEY" ]] \
            || { echo 'Signed application public update key mismatch.' >&2; exit 1; }
          python3 - dist/appcast.xml "dist/${{ steps.release.outputs.archive_name }}" \
            '${{ steps.release.outputs.archive_base_url }}/${{ steps.release.outputs.archive_name }}' > "$RUNNER_TEMP/sparkle-signature.txt" <<'PY'
          import base64
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          appcast_path, archive_path, expected_url = sys.argv[1:]
          root = ET.parse(appcast_path).getroot()
          namespace = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          enclosures = root.findall(".//enclosure")
          if len(enclosures) != 1:
              raise SystemExit("appcast must contain exactly one enclosure")
          enclosure = enclosures[0]
          if enclosure.get("url") != expected_url:
              raise SystemExit("appcast enclosure URL mismatch")
          expected_size = pathlib.Path(archive_path).stat().st_size
          if enclosure.get("length") != str(expected_size):
              raise SystemExit("appcast enclosure size mismatch")
          signature = enclosure.get(f"{{{namespace}}}edSignature", "")
          try:
              decoded = base64.b64decode(signature, validate=True)
          except Exception as error:
              raise SystemExit("appcast signature is not canonical base64") from error
          if len(decoded) != 64:
              raise SystemExit("appcast signature is not an Ed25519 signature")
          versions = {(element.text or "").strip() for element in root.findall(f".//{{{namespace}}}version")}
          versions.update(enclosure.get(f"{{{namespace}}}version", "") for enclosure in enclosures)
          versions.discard("")
          if versions != {"${{ steps.release.outputs.build }}"}:
              raise SystemExit("appcast build identity mismatch")
          print(signature)
          PY
          sparkle_dir="$(scripts/fetch-sparkle.sh --print-dir)"
          observed_key="$("$sparkle_dir/bin/generate_keys" -p | grep -Eo '[A-Za-z0-9+/]{43}=' | sort -u)"
          [[ "$observed_key" == "$EXPECTED_PUBLIC_KEY" ]] \
            || { echo 'Sparkle verification key no longer matches the protected public key.' >&2; exit 1; }
          "$sparkle_dir/bin/sign_update" --verify \
            "dist/${{ steps.release.outputs.archive_name }}" \
            "$(cat "$RUNNER_TEMP/sparkle-signature.txt")"
          for entry in dmg:CrowdCast.dmg archive:${{ steps.release.outputs.archive_name }}; do
            key="${entry%%:*}"
            file="${entry#*:}"
            echo "${key}_sha256=$(shasum -a 256 "dist/$file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "${key}_size=$(wc -c < "dist/$file" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          done

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reserve exact release identity before publication
        run: |
          set -euo pipefail
          [[ "$(aws s3api get-bucket-versioning --bucket "$S3_BUCKET" --query Status --output text)" == Enabled ]] \
            || { echo 'S3 bucket versioning must be Enabled.' >&2; exit 1; }
          reservation="$RUNNER_TEMP/release-reservation.json"
          python3 - "$reservation" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as reservation_file:
              json.dump({
                  "schema": "crowd-cast-release-reservation-v1",
                  "platform": "macos",
                  "channel": "${{ steps.release.outputs.channel }}",
                  "build": int("${{ steps.release.outputs.build }}"),
                  "commit": "${{ github.sha }}",
                  "run_id": "${{ github.run_id }}",
              }, reservation_file, separators=(",", ":"), sort_keys=True)
          PY
          aws s3api put-object \
            --bucket "$S3_BUCKET" \
            --key 'release-ledger/macos/${{ steps.release.outputs.channel }}/${{ steps.release.outputs.build }}/reservation.json' \
            --body "$reservation" \
            --if-none-match '*' >/dev/null

      - name: Publish and read back exact GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          title='crowd-cast macOS ${{ steps.release.outputs.version }} build ${{ steps.release.outputs.build }} (${{ inputs.channel }})'
          args=(release create "$tag" \
            dist/CrowdCast.dmg \
            'dist/${{ steps.release.outputs.archive_name }}' \
            --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' \
            --title "$title" \
            --latest=false)
          if [[ '${{ inputs.channel }}' == dev ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
          gh api 'repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag }}' > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json
          import sys

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if not release.get("immutable"):
              raise SystemExit("repository immutable releases must be enabled")
          if release.get("target_commitish") != "${{ github.sha }}":
              raise SystemExit("GitHub release target SHA mismatch")
          if bool(release.get("prerelease")) != ("${{ inputs.channel }}" == "dev"):
              raise SystemExit("GitHub prerelease state mismatch")
          expected = {
              "CrowdCast.dmg": int("${{ steps.artifact.outputs.dmg_size }}"),
              "${{ steps.release.outputs.archive_name }}": int("${{ steps.artifact.outputs.archive_size }}"),
          }
          actual = {asset["name"]: asset["size"] for asset in release.get("assets", [])}
          if actual != expected:
              raise SystemExit(f"GitHub release asset set mismatch: {actual!r}")
          PY
          mkdir "$RUNNER_TEMP/release-readback"
          gh release download "$tag" --repo '${{ github.repository }}' --dir "$RUNNER_TEMP/release-readback"
          [[ "$(shasum -a 256 "$RUNNER_TEMP/release-readback/CrowdCast.dmg" | awk '{print $1}')" == '${{ steps.artifact.outputs.dmg_sha256 }}' ]] \
            || { echo 'GitHub DMG readback mismatch.' >&2; exit 1; }
          [[ "$(shasum -a 256 "$RUNNER_TEMP/release-readback/${{ steps.release.outputs.archive_name }}" | awk '{print $1}')" == '${{ steps.artifact.outputs.archive_sha256 }}' ]] \
            || { echo 'GitHub Sparkle archive readback mismatch.' >&2; exit 1; }

      - name: Publish immutable release receipt
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/release-receipt.json"
          python3 - "$receipt" <<'PY'
          import json
          import sys

          receipt = {
              "schema": "crowd-cast-release-receipt-v1",
              "platform": "macos",
              "channel": "${{ inputs.channel }}",
              "version": "${{ steps.release.outputs.version }}",
              "build": int("${{ steps.release.outputs.build }}"),
              "commit": "${{ github.sha }}",
              "runner": "${{ runner.name }}",
              "macos_version": "${{ vars.MACOS_VERSION }}",
              "xcode_version_sha256": "${{ vars.MACOS_XCODE_VERSION_SHA256 }}",
              "sparkle": {
                  "version": "2.8.1",
                  "archive_size": 13660640,
                  "archive_sha256": "5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be",
              },
              "libobs_manifest_sha256": "${{ steps.native.outputs.manifest_sha256 }}",
              "libobs_implementation_id": "${{ steps.native.outputs.implementation_id }}",
              "assets": {
                  "CrowdCast.dmg": {"size": int("${{ steps.artifact.outputs.dmg_size }}"), "sha256": "${{ steps.artifact.outputs.dmg_sha256 }}"},
                  "${{ steps.release.outputs.archive_name }}": {"size": int("${{ steps.artifact.outputs.archive_size }}"), "sha256": "${{ steps.artifact.outputs.archive_sha256 }}"},
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, separators=(",", ":"), sort_keys=True)
          PY
          key='release-ledger/macos/${{ inputs.channel }}/${{ steps.release.outputs.build }}/receipt.json'
          aws s3api put-object --bucket "$S3_BUCKET" --key "$key" --body "$receipt" --content-type application/json --if-none-match '*' >/dev/null
          aws s3api get-object --bucket "$S3_BUCKET" --key "$key" "$RUNNER_TEMP/release-receipt-readback.json" >/dev/null
          cmp "$receipt" "$RUNNER_TEMP/release-receipt-readback.json"

      - name: Publish appcast pointer last with rollback
        run: |
          set -euo pipefail
          scripts/publish-s3-pointer.sh \
            --bucket "$S3_BUCKET" \
            --pointer-key '${{ steps.release.outputs.feed_key }}' \
            --archive-key 'release-feed-archive/macos/${{ inputs.channel }}/${{ steps.release.outputs.tag }}/appcast.xml' \
            --file dist/appcast.xml \
            --content-type application/xml
