name: Linux Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release authority and isolated update feed
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: write
  id-token: write

concurrency:
  group: linux-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  S3_BUCKET: crowd-cast-bucket
  AWS_REGION: us-east-1

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: crowd-cast-linux-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify dispatch, source, and release authority
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUNNER_IMAGE_VERSION: ${{ vars.LINUX_RUNNER_IMAGE_VERSION }}
          APPROVED_LIBOBS_REVISION: ${{ vars.APPROVED_LIBOBS_REVISION }}
        run: |
          set -euo pipefail
          [[ '${{ github.run_attempt }}' == 1 ]] || { echo 'Release reruns are forbidden; dispatch a new monotonic build.' >&2; exit 1; }
          [[ -n "$EXPECTED_RUNNER_IMAGE_VERSION" ]] || { echo 'LINUX_RUNNER_IMAGE_VERSION is required.' >&2; exit 1; }
          [[ "$ImageVersion" == "$EXPECTED_RUNNER_IMAGE_VERSION" ]] \
            || { echo "Hosted runner image drift: expected $EXPECTED_RUNNER_IMAGE_VERSION, got $ImageVersion." >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == '${{ github.sha }}' ]] || { echo 'Checkout identity mismatch.' >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'Release checkout is not clean.' >&2; exit 1; }

          [[ '${{ github.ref }}' == refs/heads/main ]] || { echo 'Release dispatch requires refs/heads/main.' >&2; exit 1; }
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_main" == '${{ github.sha }}' ]] || { echo "Release SHA is not current remote main: $remote_main" >&2; exit 1; }
          gh api 'repos/${{ github.repository }}/environments/crowd-cast-linux-${{ inputs.channel }}' > "$RUNNER_TEMP/environment.json"
          gh api 'repos/${{ github.repository }}/immutable-releases' > "$RUNNER_TEMP/immutable-releases.json"
          python3 - "$RUNNER_TEMP/environment.json" <<'PY'
          import json, sys
          environment = json.load(open(sys.argv[1], encoding="utf-8"))
          if not environment.get("protection_rules"):
              raise SystemExit("release environment has no protection rules")
          policy = environment.get("deployment_branch_policy") or {}
          if not policy.get("protected_branches"):
              raise SystemExit("release environment must require protected branches")
          PY
          python3 - "$RUNNER_TEMP/immutable-releases.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1], encoding="utf-8")).get("enabled") is not True:
              raise SystemExit("repository immutable releases are not enabled")
          PY

          [[ "$APPROVED_LIBOBS_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo 'APPROVED_LIBOBS_REVISION must be the independently accepted commit.' >&2; exit 1; }
          python3 - "$APPROVED_LIBOBS_REVISION" <<'PY'
          import pathlib, re, sys
          approved = sys.argv[1]
          cargo = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          lines = [line for line in cargo.splitlines() if re.match(r"^(libobs|libobs-wrapper|libobs-simple|libobs-bootstrapper|cargo-obs-build)\s*=", line)]
          if len(lines) < 4:
              raise SystemExit("expected libobs dependencies are missing")
          revisions = []
          for line in lines:
              match = re.search(r'rev\s*=\s*"([0-9a-f]{40})"', line)
              if not match:
                  raise SystemExit(f"mutable libobs dependency: {line}")
              revisions.append(match.group(1))
          if set(revisions) != {approved}:
              raise SystemExit("Cargo libobs pins do not equal the independently approved revision")
          PY
          ! rg -n 'cargo_obs_build::install|ObsBootstrapperOptions::default|set_update\(' build.rs src/capture/context.rs \
            || { echo 'OBS installation is not bound to one application manifest.' >&2; exit 1; }
          ! rg -n 'falling back to a system OBS|CROWD_CAST_OBS_(DATA|PLUGIN)' src/capture/context.rs \
            || { echo 'Linux still permits an unbound OBS runtime fallback.' >&2; exit 1; }
          rg -q 'CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256' src/capture/context.rs \
            || { echo 'Linux runtime does not bind an exact native manifest.' >&2; exit 1; }
          rg -q 'libobs-bootstrap-receipt-v1' src/capture/context.rs \
            || { echo 'Linux runtime does not require the native install receipt.' >&2; exit 1; }
          ! rg -n '"\$ENGINE" build|placeholder.invalid|CROWD_CAST_OBS_ABI:-' packaging/linux/run-build-binary.sh packaging/linux/build-binary.sh \
            || { echo 'Linux builder retains mutable or placeholder inputs.' >&2; exit 1; }
          echo 'Linux release is blocked until a signed or read-only package authorizes the exact OBS closure before the dynamic loader resolves DT_NEEDED libobs; an in-process receipt cannot authorize a user-writable pre-main library.' >&2
          exit 1

      - name: Record exact runner tools
        run: |
          set -euo pipefail
          docker version
          gh --version
          aws --version
          python3 --version

      - name: Read back exact native bundle manifest and archive
        id: native
        env:
          MANIFEST_URL: ${{ vars.CROWD_CAST_OBS_BUNDLE_MANIFEST_URL }}
          MANIFEST_SHA256: ${{ vars.CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256 }}
          APPROVED_LIBOBS_REVISION: ${{ vars.APPROVED_LIBOBS_REVISION }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Native manifest SHA-256 is not canonical.' >&2; exit 1; }
          python3 - "$MANIFEST_URL" <<'PY'
          import sys, urllib.parse
          value = sys.argv[1]
          if not value.isascii() or any(ord(character) <= 32 or ord(character) == 127 for character in value):
              raise SystemExit("native manifest URL contains forbidden characters")
          url = urllib.parse.urlsplit(value)
          if url.scheme != "https" or not url.hostname or url.username or url.password or url.query or url.fragment or url.geturl() != value:
              raise SystemExit("native manifest URL must be exact HTTPS without credentials, query, or fragment")
          PY
          manifest="$RUNNER_TEMP/obs-bundle-manifest.json"
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-filesize 1048576 \
            --connect-timeout 10 --max-time 120 --output "$manifest" "$MANIFEST_URL"
          summary="$RUNNER_TEMP/obs-bundle-summary.json"
          scripts/verify-obs-bundle-manifest.py \
            --manifest "$manifest" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --platform linux \
            --arch x86_64 \
            --approved-libobs-revision "$APPROVED_LIBOBS_REVISION" \
            --summary-out "$summary"
          mapfile -t native < <(python3 - "$summary" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("bundle_url", "bundle_sha256", "bundle_size", "obs_abi", "implementation_id"):
              print(summary[key])
          PY
          )
          [[ "${#native[@]}" -eq 5 ]] || { echo 'Native manifest extraction failed.' >&2; exit 1; }
          bundle="$RUNNER_TEMP/obs-bundle.tar.zst"
          curl --disable --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-filesize "${native[2]}" \
            --connect-timeout 10 --max-time 300 --output "$bundle" "${native[0]}"
          scripts/verify-obs-bundle-manifest.py \
            --manifest "$manifest" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --platform linux \
            --arch x86_64 \
            --approved-libobs-revision "$APPROVED_LIBOBS_REVISION" \
            --bundle "$bundle" \
            --summary-out "$summary"
          mkdir -p packaging/linux/out
          cp "$bundle" "packaging/linux/out/obs-bundle-${native[3]}-x86_64.tar.zst"
          {
            echo "CROWD_CAST_OBS_BUNDLE_MANIFEST_PATH=$manifest"
            echo "CROWD_CAST_OBS_BUNDLE_MANIFEST_SHA256=$MANIFEST_SHA256"
          } >> "$GITHUB_ENV"
          {
            echo "manifest_url=$MANIFEST_URL"
            echo "manifest_sha256=$MANIFEST_SHA256"
            echo "bundle_url=${native[0]}"
            echo "bundle_sha256=${native[1]}"
            echo "bundle_size=${native[2]}"
            echo "abi=${native[3]}"
            echo "implementation_id=${native[4]}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve monotonic release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID_FLOOR: ${{ vars.BUILD_ID_FLOOR }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cargo version is not release SemVer: $version" >&2; exit 1; }
          build='${{ github.run_number }}'
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || { echo 'Build number must be positive.' >&2; exit 1; }
          [[ "$BUILD_ID_FLOOR" =~ ^(0|[1-9][0-9]*)$ ]] || { echo 'BUILD_ID_FLOOR must be a canonical non-negative integer.' >&2; exit 1; }
          python3 - "$build" "$BUILD_ID_FLOOR" <<'PY'
          import sys
          if int(sys.argv[1]) <= int(sys.argv[2]):
              raise SystemExit("build identity does not exceed the protected migration floor")
          PY
          channel='${{ inputs.channel }}'
          if [[ "$channel" == prod ]]; then
            tag="linux-v$version+$build"
            feed_key=appcast-linux.json
            upload_test=""
          else
            tag="linux-dev-v$version+$build"
            feed_key=appcast-linux-dev.json
            upload_test=1
          fi
          feed_url="https://$S3_BUCKET.s3.amazonaws.com/$feed_key"
          [[ -z "$(git ls-remote origin "refs/tags/$tag")" ]] || { echo "Remote tag already exists: $tag" >&2; exit 1; }
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "GitHub release already exists: $tag" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "feed_key=$feed_key"
            echo "feed_url=$feed_url"
            echo "upload_test=$upload_test"
          } >> "$GITHUB_OUTPUT"

      - name: Build agent and signer in exact builder image
        env:
          ENGINE: docker
          CROWD_CAST_BUILDER_IMAGE: ${{ vars.LINUX_BUILDER_IMAGE }}
          CROWD_CAST_RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          CROWD_CAST_OBS_ABI: ${{ steps.native.outputs.abi }}
          CROWD_CAST_BUILD_NUMBER: ${{ steps.release.outputs.build }}
          CROWD_CAST_API_GATEWAY_URL: ${{ secrets.CROWD_CAST_API_GATEWAY_URL }}
          CROWD_CAST_GOOGLE_CLIENT_ID: ${{ secrets.CROWD_CAST_GOOGLE_CLIENT_ID }}
          CROWD_CAST_UPDATE_FEED_URL: ${{ steps.release.outputs.feed_url }}
          CROWD_CAST_UPDATE_PUBKEY: ${{ secrets.CROWD_CAST_ED_PUBLIC_KEY }}
          CROWD_CAST_UPLOAD_TEST: ${{ steps.release.outputs.upload_test }}
        run: |
          set -euo pipefail
          packaging/linux/run-build-binary.sh
          mkdir -p dist
          cp packaging/linux/out/crowd-cast-agent-x86_64 dist/crowd-cast-agent-x86_64
          cp packaging/linux/out/cc-sign-manifest dist/cc-sign-manifest

      - name: Generate and verify signed appcast
        id: artifact
        env:
          ED_PRIVATE_KEY: ${{ secrets.CROWD_CAST_ED_PRIVATE_KEY }}
          ED_PUBLIC_KEY: ${{ secrets.CROWD_CAST_ED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/ed25519.key"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ED_PRIVATE_KEY" > "$keyfile"
          scripts/release-linux.sh \
            --version '${{ steps.release.outputs.version }}' \
            --build '${{ steps.release.outputs.build }}' \
            --abi '${{ steps.native.outputs.abi }}' \
            --binary dist/crowd-cast-agent-x86_64 \
            --bundle packaging/linux/out/obs-bundle-${{ steps.native.outputs.abi }}-x86_64.tar.zst \
            --download-base 'https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}' \
            --bundle-url '${{ steps.native.outputs.bundle_url }}' \
            --bundle-manifest-url '${{ steps.native.outputs.manifest_url }}' \
            --bundle-manifest-sha256 '${{ steps.native.outputs.manifest_sha256 }}' \
            --bundle-implementation-id '${{ steps.native.outputs.implementation_id }}' \
            --signer dist/cc-sign-manifest \
            --key-file "$keyfile" \
            --public-key "$ED_PUBLIC_KEY" \
            --out-dir dist
          python3 - '${{ steps.release.outputs.feed_url }}' "$ED_PUBLIC_KEY" \
            packaging/linux/install.sh dist/install-linux.sh <<'PY'
          import pathlib, sys
          feed_url, public_key, source, destination = sys.argv[1:]
          text = pathlib.Path(source).read_text(encoding="utf-8")
          text = text.replace("__CROWD_CAST_DEFAULT_FEED_URL__", feed_url)
          text = text.replace("__CROWD_CAST_UPDATE_PUBKEY__", public_key)
          if "__CROWD_CAST_" in text:
              raise SystemExit("installer retains an unresolved release placeholder")
          pathlib.Path(destination).write_text(text, encoding="utf-8")
          PY
          chmod 0755 dist/install-linux.sh
          cp assets/logo.png dist/logo.png
          for entry in \
            binary:crowd-cast-agent-x86_64 \
            installer:install-linux.sh \
            logo:logo.png
          do
            key="${entry%%:*}"
            file="${entry#*:}"
            path="dist/$file"
            echo "${key}_sha256=$(sha256sum "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "${key}_size=$(wc -c < "$path" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          done

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reserve exact release identity before publication
        run: |
          set -euo pipefail
          versioning="$(aws s3api get-bucket-versioning --bucket "$S3_BUCKET" --query Status --output text)"
          [[ "$versioning" == Enabled ]] || { echo 'S3 bucket versioning must be Enabled.' >&2; exit 1; }
          reservation="$RUNNER_TEMP/release-reservation.json"
          python3 - "$reservation" <<'PY'
          import json, sys
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({
                  "schema": "crowd-cast-release-reservation-v1",
                  "platform": "linux",
                  "channel": "${{ steps.release.outputs.channel }}",
                  "build": int("${{ steps.release.outputs.build }}"),
                  "commit": "${{ github.sha }}",
                  "run_id": "${{ github.run_id }}",
              }, f, separators=(",", ":"), sort_keys=True)
          PY
          aws s3api put-object \
            --bucket "$S3_BUCKET" \
            --key 'release-ledger/linux/${{ steps.release.outputs.channel }}/${{ steps.release.outputs.build }}/reservation.json' \
            --body "$reservation" \
            --if-none-match '*' >/dev/null

      - name: Publish and read back exact GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          title='crowd-cast Linux ${{ steps.release.outputs.version }} build ${{ steps.release.outputs.build }} (${{ inputs.channel }})'
          args=(release create "$tag" \
            dist/crowd-cast-agent-x86_64 \
            dist/install-linux.sh \
            dist/logo.png \
            --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' \
            --title "$title" \
            --latest=false)
          [[ '${{ inputs.channel }}' == dev ]] && args+=(--prerelease)
          gh "${args[@]}"
          gh api 'repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag }}' > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if not release.get("immutable"):
              raise SystemExit("repository immutable releases must be enabled")
          if release.get("target_commitish") != "${{ github.sha }}":
              raise SystemExit("GitHub release target SHA mismatch")
          if bool(release.get("prerelease")) != ("${{ inputs.channel }}" == "dev"):
              raise SystemExit("GitHub prerelease state mismatch")
          expected = {
              "crowd-cast-agent-x86_64": int("${{ steps.artifact.outputs.binary_size }}"),
              "install-linux.sh": int("${{ steps.artifact.outputs.installer_size }}"),
              "logo.png": int("${{ steps.artifact.outputs.logo_size }}"),
          }
          actual = {asset["name"]: asset["size"] for asset in release.get("assets", [])}
          if actual != expected:
              raise SystemExit(f"GitHub release asset set mismatch: {actual!r}")
          PY
          mkdir "$RUNNER_TEMP/release-readback"
          gh release download "$tag" --repo '${{ github.repository }}' --dir "$RUNNER_TEMP/release-readback"
          for file in crowd-cast-agent-x86_64 install-linux.sh logo.png; do
            case "$file" in
              crowd-cast-agent-x86_64) expected='${{ steps.artifact.outputs.binary_sha256 }}' ;;
              install-linux.sh) expected='${{ steps.artifact.outputs.installer_sha256 }}' ;;
              logo.png) expected='${{ steps.artifact.outputs.logo_sha256 }}' ;;
            esac
            [[ "$(sha256sum "$RUNNER_TEMP/release-readback/$file" | cut -d' ' -f1)" == "$expected" ]] \
              || { echo "GitHub asset readback mismatch: $file" >&2; exit 1; }
          done

      - name: Publish immutable release receipt
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/release-receipt.json"
          python3 - "$receipt" <<'PY'
          import json, sys
          receipt = {
              "schema": "crowd-cast-release-receipt-v1",
              "platform": "linux",
              "channel": "${{ inputs.channel }}",
              "version": "${{ steps.release.outputs.version }}",
              "build": int("${{ steps.release.outputs.build }}"),
              "commit": "${{ github.sha }}",
              "runner_image": "${{ runner.os }}/${{ vars.LINUX_RUNNER_IMAGE_VERSION }}",
              "builder_image": "${{ vars.LINUX_BUILDER_IMAGE }}",
              "libobs_manifest_sha256": "${{ steps.native.outputs.manifest_sha256 }}",
              "libobs_implementation_id": "${{ steps.native.outputs.implementation_id }}",
              "assets": {
                  "crowd-cast-agent-x86_64": {"size": int("${{ steps.artifact.outputs.binary_size }}"), "sha256": "${{ steps.artifact.outputs.binary_sha256 }}"},
                  "install-linux.sh": {"size": int("${{ steps.artifact.outputs.installer_size }}"), "sha256": "${{ steps.artifact.outputs.installer_sha256 }}"},
                  "logo.png": {"size": int("${{ steps.artifact.outputs.logo_size }}"), "sha256": "${{ steps.artifact.outputs.logo_sha256 }}"},
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(receipt, f, separators=(",", ":"), sort_keys=True)
          PY
          key='release-ledger/linux/${{ inputs.channel }}/${{ steps.release.outputs.build }}/receipt.json'
          aws s3api put-object --bucket "$S3_BUCKET" --key "$key" --body "$receipt" --content-type application/json --if-none-match '*' >/dev/null
          aws s3api get-object --bucket "$S3_BUCKET" --key "$key" "$RUNNER_TEMP/release-receipt-readback.json" >/dev/null
          cmp "$receipt" "$RUNNER_TEMP/release-receipt-readback.json"

      - name: Publish signed feed pointer last with rollback
        run: |
          set -euo pipefail
          scripts/publish-s3-signed-feed.sh \
            --bucket "$S3_BUCKET" \
            --pointer-key '${{ steps.release.outputs.feed_key }}' \
            --archive-prefix 'release-feed-archive/linux/${{ inputs.channel }}/${{ steps.release.outputs.tag }}' \
            --manifest dist/appcast-linux.json \
            --signature dist/appcast-linux.json.sig
